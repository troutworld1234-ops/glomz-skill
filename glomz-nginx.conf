upstream glomz_backend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name glomz.com www.glomz.com;

    # Serve frontend static pages
    location = / {
        root /root/.openclaw/workspace/glomz/frontend;
        try_files /index.html =404;
    }

    location = /octagon {
        root /root/.openclaw/workspace/glomz/frontend;
        try_files /octagon.html =404;
    }

    location = /challenges {
        root /root/.openclaw/workspace/glomz/frontend;
        try_files /challenges.html =404;
    }

    # Proxy all /api/* requests to Flask backend
    location /api/ {
        proxy_pass http://glomz_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Octagon page served by backend (line 793 route)
    location = /octagon-page {
        proxy_pass http://glomz_backend;
        proxy_set_header Host $host;
    }

    # Static assets
    location /static/ {
        alias /root/.openclaw/workspace/glomz/frontend/;
        expires 7d;
    }

    # Fallback
    location / {
        root /root/.openclaw/workspace/glomz/frontend;
        try_files $uri $uri/ /index.html =404;
    }
}
